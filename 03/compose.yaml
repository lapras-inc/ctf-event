name: lapras-03
services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8003}:8000"
    environment:
      FLAG: "${FLAG:-LAPRAS{s4m3_byt35_d1ff3r3nt_m34n1ng}}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
